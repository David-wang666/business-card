<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电子名片</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:#0a0a0f;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
  color:#e8e6e3;
}
.container{max-width:420px;width:100%;padding:16px}

/* 主卡片 */
.card{
  background:#141419;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 25px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05);
}

/* 顶栏 - 风景照片 */
.hero{
  position:relative;
  height:240px;
  overflow:hidden;
}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero-overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 30%,#141419 95%);
}

/* 头像/名字区 */
.profile{
  position:relative;
  margin-top:-60px;
  padding:0 28px 24px;
  display:flex;
  align-items:flex-end;
  gap:18px;
}
.avatar{
  width:88px;height:88px;border-radius:50%;
  border:3px solid #2a2a32;
  background:linear-gradient(135deg,#7c5cfc,#5b8def);
  display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:700;color:#fff;
  flex-shrink:0;
  box-shadow:0 8px 24px rgba(91,141,239,.25);
}
.info h1{font-size:24px;font-weight:700;letter-spacing:.5px}
.info .tagline{font-size:14px;color:#888;margin-top:4px;line-height:1.5}

/* 分隔装饰 */
.divider{height:1px;background:linear-gradient(90deg,transparent,#2a2a32,transparent);margin:0 28px}

/* 才能展示区 */
.talents{padding:24px 28px}
.talents h2{
  font-size:15px;color:#666;letter-spacing:2px;text-transform:uppercase;
  margin-bottom:18px;
}
.talent-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.talent-card{
  background:#1c1c24;
  border-radius:16px;
  padding:18px 16px;
  cursor:pointer;
  transition:all .3s ease;
  border:1px solid transparent;
}
.talent-card:hover{
  background:#21212b;
  border-color:#3a3a48;
  transform:translateY(-2px);
}
.talent-card:active{transform:scale(.97)}
.talent-icon{
  width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;margin-bottom:12px;
}
.talent-card h3{font-size:15px;font-weight:600;margin-bottom:4px}
.talent-card p{font-size:12px;color:#777;line-height:1.4}
.tc-music .talent-icon{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff}
.tc-code .talent-icon{background:linear-gradient(135deg,#5b8def,#7c5cfc);color:#fff}
.tc-art .talent-icon{background:linear-gradient(135deg,#f9ca24,#f0932b);color:#fff}
.tc-sport .talent-icon{background:linear-gradient(135deg,#26de81,#20bf6b);color:#fff}
.tc-photo .talent-icon{background:linear-gradient(135deg,#a29bfe,#6c5ce7);color:#fff}
.tc-write .talent-icon{background:linear-gradient(135deg,#fd79a8,#e84393);color:#fff}

/* 联系区 */
.contact{padding:24px 28px 32px}
.contact h2{
  font-size:15px;color:#666;letter-spacing:2px;text-transform:uppercase;
  margin-bottom:16px;
}
.contact-items{display:flex;flex-direction:column;gap:12px}
.contact-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;
  background:#1c1c24;border-radius:14px;
  text-decoration:none;color:#e8e6e3;
  transition:background .25s;
}
.contact-item:hover{background:#24242e}
.contact-icon{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.ci-email .contact-icon{background:linear-gradient(135deg,#ff6b6b,#ee5a24)}
.ci-phone .contact-icon{background:linear-gradient(135deg,#5b8def,#7c5cfc)}
.ci-web .contact-icon{background:linear-gradient(135deg,#26de81,#20bf6b)}
.contact-item .label{font-size:12px;color:#777}
.contact-item .value{font-size:14px;font-weight:500}

/* 底部标签 */
.footer{
  padding:16px 28px 24px;
  text-align:center;
  font-size:12px;color:#444;
  letter-spacing:1px;
}

/* 动画 */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
.talent-card,.contact-item{animation:fadeUp .5s ease both}
.talent-card:nth-child(1){animation-delay:.1s}
.talent-card:nth-child(2){animation-delay:.15s}
.talent-card:nth-child(3){animation-delay:.2s}
.talent-card:nth-child(4){animation-delay:.25s}
.talent-card:nth-child(5){animation-delay:.3s}
.talent-card:nth-child(6){animation-delay:.35s}
.contact-item:nth-child(1){animation-delay:.4s}
.contact-item:nth-child(2){animation-delay:.45s}
.contact-item:nth-child(3){animation-delay:.5s}

/* 才能弹窗 */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.7);
  justify-content:center;align-items:center;
  padding:24px;
}
.modal-overlay.active{display:flex}
.modal{
  background:#1c1c24;border-radius:24px;
  padding:32px 28px;max-width:380px;width:100%;
  box-shadow:0 30px 60px rgba(0,0,0,.5);
  position:relative;
  animation:fadeUp .3s ease both;
}
.modal-close{
  position:absolute;top:16px;right:18px;
  background:none;border:none;color:#666;
  font-size:22px;cursor:pointer;
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.modal-close:hover{background:#2a2a34;color:#fff}
.modal .talent-icon{width:48px;height:48px;border-radius:14px;font-size:24px;margin-bottom:16px}
.modal h3{font-size:20px;font-weight:700;margin-bottom:8px}
.modal p{font-size:14px;color:#999;line-height:1.7}
</style>
</head>
<body>

<div class="container">
  <div class="card">

    <!-- 顶栏风景 -->
    <div class="hero">
      <img src="2958663a808bcbc47c9293e32353e3be.jpg" alt="风景">
      <div class="hero-overlay"></div>
    </div>

    <!-- 头像与名字 -->
    <div class="profile">
      <div class="avatar">D</div>
      <div class="info">
        <h1>大卫</h1>
        <div class="tagline">产品设计师 · 创意多面手<br>用好奇心探索世界的每个角落</div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 才艺网格 -->
    <div class="talents">
      <h2>✦ 多才多艺</h2>
      <div class="talent-grid" id="talentGrid"></div>
    </div>

    <div class="divider"></div>

    <!-- 联系 -->
    <div class="contact">
      <h2>✦ 联系我</h2>
      <div class="contact-items">
        <a class="contact-item ci-email" href="mailto:david@example.com">
          <div class="contact-icon">✉</div>
          <div><div class="label">电子邮箱</div><div class="value">david@example.com</div></div>
        </a>
        <a class="contact-item ci-phone" href="tel:+8613800000000">
          <div class="contact-icon">◆</div>
          <div><div class="label">电话</div><div class="value">+86 138-0000-0000</div></div>
        </a>
        <a class="contact-item ci-web" href="#">
          <div class="contact-icon">◎</div>
          <div><div class="label">个人网站</div><div class="value">david.design</div></div>
        </a>
      </div>
    </div>

    <div class="footer">—— 以热爱 · 致生活 ——</div>
  </div>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const talents = [
  {
    id:'music',cls:'tc-music',icon:'♫',
    name:'音乐',desc:'钢琴十级 · 吉他弹唱',
    full:'从古典钢琴到民谣吉他，音乐是生活中最温暖的底色。曾组建校园乐队，也爱一个人在深夜写歌。'
  },
  {
    id:'code',cls:'tc-code',icon:'<',name:'编程',desc:'前后端全栈 · AI 探索',
    full:'用代码构建创意，从 Web 应用到 AI 工具，享受把想法变成现实的过程。持续学习，保持好奇。'
  },
  {
    id:'art',cls:'tc-art',icon:'◆',name:'设计',desc:'UI/UX · 品牌设计',
    full:'设计是一种语言。擅长在像素间寻找平衡，追求简洁与温度并存的美学表达。'
  },
  {
    id:'sport',cls:'tc-sport',icon:'△',name:'户外',desc:'登山 · 骑行 · 马拉松',
    full:'身体和灵魂，总要有一个在路上。跑过 5 场全马，骑行过川藏线，山野是最好的充电站。'
  },
  {
    id:'photo',cls:'tc-photo',icon:'◐',name:'摄影',desc:'人文纪实 · 风光',
    full:'用镜头捕捉瞬间。街头的烟火、山间的晨雾，每一帧都是对世界的温柔观察。'
  },
  {
    id:'write',cls:'tc-write',icon:'▪',name:'写作',desc:'专栏作者 · 诗歌',
    full:'文字是思想的形状。在技术和人文之间行走，偶尔写写诗，记录那些闪闪发光的日常。'
  }
];

const grid = document.getElementById('talentGrid');
talents.forEach((t,i)=>{
  const div = document.createElement('div');
  div.className = 'talent-card ' + t.cls;
  div.style.animationDelay = (0.1 + i*0.05) + 's';
  div.innerHTML = '<div class="talent-icon">'+t.icon+'</div><h3>'+t.name+'</h3><p>'+t.desc+'</p>';
  div.onclick = ()=>openModal(t);
  grid.appendChild(div);
});

function openModal(t){
  const mc = document.getElementById('modalContent');
  mc.innerHTML = '<div class="talent-icon" style="background:linear-gradient(135deg,'+
    (t.id==='music'?'#ff6b6b,#ee5a24':t.id==='code'?'#5b8def,#7c5cfc':t.id==='art'?'#f9ca24,#f0932b':t.id==='sport'?'#26de81,#20bf6b':t.id==='photo'?'#a29bfe,#6c5ce7':'#fd79a8,#e84393')+
    ')">'+t.icon+'</div><h3>'+t.name+'</h3><p>'+t.full+'</p>';
  document.getElementById('modal').classList.add('active');
}
function closeModal(){
  document.getElementById('modal').classList.remove('active');
}
document.getElementById('modal').onclick = function(e){
  if(e.target === this) closeModal();
};
</script>
</body>
</html>
